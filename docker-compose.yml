services:
  db:
    image: postgres:16-alpine
    container_name: cpf_searcher_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cpf_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cpf_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: cpf_searcher_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SSP_DATABASE_URL=postgresql://user:password@db:5432/cpf_db
      - SQUID_URL
    command: sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
